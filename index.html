<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ほくほく！土掘り焼き芋名人</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            background-color: #2a1a08;
            background-image: radial-gradient(#3d2712 15%, transparent 16%), radial-gradient(#3d2712 15%, transparent 16%);
            background-size: 50px 50px;
            background-position: 0 0, 25px 25px;
        }
        canvas {
            touch-action: none;
            cursor: pointer;
        }
        .wood-border {
            border: 6px solid #6b3e1e;
            box-shadow: inset 0 0 12px rgba(0,0,0,0.6), 0 10px 20px rgba(0, 0, 0, 0.5);
        }
        .splash-text {
            text-shadow: 3px 3px 0 #2a1508, -1px -1px 0 #2a1508, 1px -1px 0 #2a1508, -1px 1px 0 #2a1508, 1px 1px 0 #2a1508;
        }
        @keyframes bounce-short {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .animate-bounce-short {
            animation: bounce-short 1.2s infinite;
        }
    </style>
</head>
<body class="min-h-screen text-amber-50 flex flex-col items-center justify-between p-2 sm:p-4 overflow-x-hidden">

    <!-- ヘッダー・スコアボード -->
    <header class="w-full max-w-md bg-amber-950/85 backdrop-blur border-2 border-amber-700/80 rounded-2xl p-3 mb-2 shadow-xl flex justify-between items-center text-amber-100">
        <div class="flex items-center gap-2">
            <div class="bg-amber-900/90 p-2 rounded-xl border border-amber-600/50">
                <i class="fa-solid fa-wheat-awn text-2xl text-purple-400"></i>
            </div>
            <div>
                <div class="text-xs text-amber-300 font-bold">収穫数</div>
                <div class="text-xl font-black text-amber-100"><span id="harvest-count">0</span> <span class="text-xs font-normal">本</span></div>
            </div>
        </div>
        
        <div class="text-center">
            <div class="text-xs text-amber-300 font-bold">残り時間</div>
            <div id="timer" class="text-2xl font-black text-amber-400">50</div>
        </div>

        <div class="flex items-center gap-2">
            <div class="text-right">
                <div class="text-xs text-amber-300 font-bold">スコア</div>
                <div class="text-xl font-black text-yellow-400"><span id="score">0</span> <span class="text-xs font-normal">pt</span></div>
            </div>
            <div class="bg-amber-900/90 p-2 rounded-xl border border-amber-600/50">
                <i class="fa-solid fa-trophy text-2xl text-yellow-400"></i>
            </div>
        </div>
    </header>

    <!-- メインゲームエリア -->
    <main class="relative w-full max-w-md flex-1 flex flex-col justify-center items-center">

        <!-- キャンバスコンテナ -->
        <div class="relative w-full aspect-[4/5] bg-gradient-to-b from-amber-950 via-stone-900 to-amber-950 rounded-3xl overflow-hidden wood-border shadow-2xl">
            <!-- ゲームメイン描画キャンバス -->
            <canvas id="gameCanvas" class="w-full h-full block"></canvas>

            <!-- 操作ヒント -->
            <div id="hint-overlay" class="absolute bottom-4 left-0 right-0 text-center pointer-events-none transition-opacity duration-300">
                <span class="bg-black/70 text-purple-200 px-4 py-2 rounded-full text-xs sm:text-sm font-bold animate-bounce-short border border-purple-500/40">
                    <i class="fa-solid fa-hand-pointer mr-1"></i> 土をなぞって掘り、蔓を引っ張ろう！
                </span>
            </div>

            <!-- エフェクト表示用レイヤー -->
            <div id="effect-layer" class="absolute inset-0 pointer-events-none"></div>

            <!-- モーダル（スタート / リザルト） -->
            <div id="modal-overlay" class="absolute inset-0 bg-black/80 backdrop-blur-sm flex flex-col justify-center items-center p-6 text-center z-20">
                
                <!-- スタート画面 -->
                <div id="start-screen" class="space-y-5">
                    <div>
                        <h1 class="text-3xl sm:text-4xl font-black text-purple-400 splash-text tracking-wider">ほくほく！<br>土掘り焼き芋名人</h1>
                        <p class="text-amber-200 text-xs sm:text-sm mt-2 font-bold">おいも畑の土を掘り起こして大収穫を目指そう！</p>
                    </div>

                    <div class="bg-amber-950/70 p-4 rounded-2xl border border-amber-700/60 text-left text-xs text-amber-100 space-y-2 max-w-xs mx-auto">
                        <p class="font-bold text-amber-300 text-sm mb-1"><i class="fa-solid fa-circle-info mr-1"></i> 遊び方</p>
                        <p>🍠 <b>土掘り：</b> 土をなぞる／擦ると芋が見えてくる！</p>
                        <p>🌿 <b>蔓引き：</b> 芋が見えたら引っ張って(タップ/フリック)すっぽん抜く！</p>
                        <p>✨ <b>黄金芋：</b> 超巨大高得点の金のさつまいも！</p>
                        <p class="text-red-400 font-bold">🪨 モグラ・石ころ： 触るとタイムロス！</p>
                    </div>

                    <button id="start-btn" class="w-full max-w-xs py-4 bg-gradient-to-r from-purple-600 to-purple-800 hover:from-purple-500 hover:to-purple-700 text-purple-100 font-black text-xl rounded-2xl shadow-xl transform active:scale-95 transition border-2 border-purple-400">
                        芋ほりスタート <i class="fa-solid fa-play ml-1"></i>
                    </button>
                </div>

                <!-- リザルト画面 -->
                <div id="result-screen" class="space-y-5 hidden w-full max-w-xs">
                    <h2 class="text-3xl font-black text-purple-400 splash-text">収穫終了！</h2>
                    
                    <div class="bg-amber-950/90 p-5 rounded-2xl border-2 border-amber-600 space-y-3">
                        <div>
                            <div class="text-xs text-amber-300 font-bold">最終獲得スコア</div>
                            <div class="text-4xl font-black text-yellow-400"><span id="final-score">0</span> <span class="text-base font-normal text-amber-200">pt</span></div>
                        </div>
                        <div class="h-px bg-amber-800"></div>
                        <div class="flex justify-between items-center text-sm">
                            <span class="text-amber-300">掘ったお芋の数:</span>
                            <span class="font-bold text-amber-100 text-lg"><span id="final-count">0</span> 本</span>
                        </div>
                        <div class="flex justify-between items-center text-sm">
                            <span class="text-amber-300">獲得称号:</span>
                            <span id="title-badge" class="font-bold text-yellow-300 bg-amber-900 px-2 py-1 rounded border border-yellow-500/40">見習い芋ほり</span>
                        </div>
                    </div>

                    <button id="restart-btn" class="w-full py-4 bg-gradient-to-r from-emerald-500 to-emerald-700 hover:from-emerald-400 hover:to-emerald-600 text-emerald-950 font-black text-xl rounded-2xl shadow-xl transform active:scale-95 transition border-2 border-emerald-300">
                        もう一度遊ぶ <i class="fa-solid fa-rotate-right ml-1"></i>
                    </button>
                </div>
            </div>
        </div>

    </main>

    <!-- フッター -->
    <footer class="w-full max-w-md mt-2 flex justify-between items-center text-xs text-amber-400/80 px-2">
        <span><i class="fa-solid fa-seedling text-emerald-500"></i> ホクホク焼き芋畑</span>
        <button id="sound-toggle" class="hover:text-amber-200 transition">
            <i class="fa-solid fa-volume-high text-base"></i> BGM/SE: ON
        </button>
    </footer>

    <!-- JavaScript ゲームロジック -->
    <script>
        // Sound System
        class SoundSystem {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playDig() {
                if (this.muted || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(100 + Math.random() * 40, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.08);

                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.08);
                } catch(e){}
            }

            playPull() {
                if (this.muted || !this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);

                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.15);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } catch(e){}
            }

            playPop() {
                if (this.muted || !this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(783.99, now + 0.08);

                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.2);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } catch(e){}
            }

            playBad() {
                if (this.muted || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(160, this.ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(70, this.ctx.currentTime + 0.2);

                    gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.2);
                } catch(e){}
            }
        }

        const audio = new SoundSystem();

        // ゲーム状態
        const state = {
            isPlaying: false,
            score: 0,
            harvestCount: 0,
            timeLeft: 50,
            timerId: null,
            canvas: null,
            ctx: null,
            dirtCanvas: null,
            dirtCtx: null,
            isDrawing: false,
            potatoes: [],
            obstacles: [],
            particles: []
        };

        const elements = {
            canvas: document.getElementById('gameCanvas'),
            score: document.getElementById('score'),
            count: document.getElementById('harvest-count'),
            timer: document.getElementById('timer'),
            overlay: document.getElementById('modal-overlay'),
            startScreen: document.getElementById('start-screen'),
            resultScreen: document.getElementById('result-screen'),
            startBtn: document.getElementById('start-btn'),
            restartBtn: document.getElementById('restart-btn'),
            finalScore: document.getElementById('final-score'),
            finalCount: document.getElementById('final-count'),
            titleBadge: document.getElementById('title-badge'),
            effectLayer: document.getElementById('effect-layer'),
            hintOverlay: document.getElementById('hint-overlay'),
            soundToggle: document.getElementById('sound-toggle')
        };

        function init() {
            state.canvas = elements.canvas;
            state.ctx = state.canvas.getContext('2d');

            state.dirtCanvas = document.createElement('canvas');
            state.dirtCtx = state.dirtCanvas.getContext('2d', { willReadFrequently: true });

            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            setupEvents();
            requestAnimationFrame(gameLoop);
        }

        function resizeCanvas() {
            const rect = state.canvas.parentElement.getBoundingClientRect();
            state.canvas.width = rect.width;
            state.canvas.height = rect.height;
            state.dirtCanvas.width = rect.width;
            state.dirtCanvas.height = rect.height;

            if (state.isPlaying) {
                resetDirtLayer();
            }
        }

        function setupEvents() {
            const c = state.canvas;

            const startAction = (e) => {
                if (!state.isPlaying) return;
                audio.init();
                state.isDrawing = true;
                const pos = getPos(e);
                handleInteract(pos.x, pos.y);
                elements.hintOverlay.style.opacity = '0';
            };

            const moveAction = (e) => {
                if (!state.isPlaying || !state.isDrawing) return;
                const pos = getPos(e);
                handleInteract(pos.x, pos.y);
            };

            const endAction = () => {
                state.isDrawing = false;
            };

            c.addEventListener('mousedown', startAction);
            c.addEventListener('mousemove', moveAction);
            c.addEventListener('mouseup', endAction);
            c.addEventListener('mouseleave', endAction);

            c.addEventListener('touchstart', (e) => { e.preventDefault(); startAction(e.touches[0]); });
            c.addEventListener('touchmove', (e) => { e.preventDefault(); moveAction(e.touches[0]); });
            c.addEventListener('touchend', endAction);

            elements.startBtn.addEventListener('click', startGame);
            elements.restartBtn.addEventListener('click', startGame);

            elements.soundToggle.addEventListener('click', () => {
                audio.muted = !audio.muted;
                elements.soundToggle.innerHTML = audio.muted ?
                    '<i class="fa-solid fa-volume-xmark text-base"></i> BGM/SE: OFF' :
                    '<i class="fa-solid fa-volume-high text-base"></i> BGM/SE: ON';
            });
        }

        function getPos(e) {
            const rect = state.canvas.getBoundingClientRect();
            return {
                x: (e.clientX - rect.left) * (state.canvas.width / rect.width),
                y: (e.clientY - rect.top) * (state.canvas.height / rect.height)
            };
        }

        // 新しいフィールド作成
        function generateField() {
            const w = state.canvas.width;
            const h = state.canvas.height;

            state.potatoes = [];
            state.obstacles = [];

            // 芋の生成（3〜5個）
            const count = Math.floor(Math.random() * 3) + 3;
            for (let i = 0; i < count; i++) {
                const isGolden = Math.random() < 0.15;
                const isLarge = Math.random() < 0.3;
                state.potatoes.push({
                    id: Math.random(),
                    x: Math.random() * (w - 120) + 60,
                    y: Math.random() * (h - 220) + 140,
                    rx: isLarge ? 45 : 30,
                    ry: isLarge ? 25 : 18,
                    angle: (Math.random() - 0.5) * 0.8,
                    isGolden: isGolden,
                    isLarge: isLarge,
                    pulledCount: 0,
                    requiredPull: isLarge ? 3 : 1,
                    uncovered: false
                });
            }

            // モグラ・石の障害物（1〜2個）
            const obsCount = Math.floor(Math.random() * 2) + 1;
            for (let i = 0; i < obsCount; i++) {
                state.obstacles.push({
                    x: Math.random() * (w - 100) + 50,
                    y: Math.random() * (h - 200) + 120,
                    r: 22,
                    type: Math.random() < 0.5 ? 'mole' : 'rock'
                });
            }

            resetDirtLayer();
        }

        // 土（削れるレイヤー）のリセット
        function resetDirtLayer() {
            const dCtx = state.dirtCtx;
            const w = state.dirtCanvas.width;
            const h = state.dirtCanvas.height;

            dCtx.globalCompositeOperation = 'source-over';
            
            // 畑の土グラデーション
            const grad = dCtx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, '#543310');
            grad.addColorStop(0.5, '#3b2208');
            grad.addColorStop(1, '#241403');
            dCtx.fillStyle = grad;
            dCtx.fillRect(0, 0, w, h);

            // 土のテクスチャノイズ
            for (let i = 0; i < 100; i++) {
                dCtx.fillStyle = Math.random() > 0.5 ? 'rgba(20, 10, 2, 0.3)' : 'rgba(120, 80, 40, 0.2)';
                dCtx.beginPath();
                dCtx.arc(Math.random() * w, Math.random() * h, Math.random() * 20 + 5, 0, Math.PI * 2);
                dCtx.fill();
            }
        }

        // 泥掘り＆引っこ抜きのアクション判定
        function handleInteract(x, y) {
            // 障害物チェック
            for (let obs of state.obstacles) {
                const dist = Math.hypot(x - obs.x, y - obs.y);
                if (dist < obs.r + 10) {
                    audio.playBad();
                    const label = obs.type === 'mole' ? "モグラだ！ -3秒" : "石ころ！ -2秒";
                    showFloatingText(x, y, label, "text-red-400");
                    createParticles(x, y, '#718096', 8);
                    state.timeLeft = Math.max(0, state.timeLeft - (obs.type === 'mole' ? 3 : 2));
                    elements.timer.innerText = state.timeLeft;
                    // 触れた障害物は消える
                    state.obstacles = state.obstacles.filter(o => o !== obs);
                    return;
                }
            }

            // 掘り削り
            const dCtx = state.dirtCtx;
            dCtx.globalCompositeOperation = 'destination-out';
            dCtx.beginPath();
            dCtx.arc(x, y, 26, 0, Math.PI * 2);
            dCtx.fill();

            audio.playDig();

            // 芋が露出したかの判定と引き抜き
            checkPotatoes(x, y);
        }

        // 芋の露出・引き抜き判定
        function checkPotatoes(x, y) {
            const dCtx = state.dirtCtx;

            for (let i = state.potatoes.length - 1; i >= 0; i--) {
                const p = state.potatoes[i];
                
                // 露出確認（中央・両端のアルファ値）
                if (!p.uncovered) {
                    const centerPixel = dCtx.getImageData(Math.floor(p.x), Math.floor(p.y), 1, 1).data;
                    if (centerPixel[3] < 120) {
                        p.uncovered = true;
                    }
                }

                // 露出後にタッチで抜く処理
                if (p.uncovered) {
                    const dist = Math.hypot(x - p.x, y - p.y);
                    if (dist < Math.max(p.rx, p.ry) + 20) {
                        p.pulledCount++;
                        audio.playPull();
                        createParticles(p.x, p.y, p.isGolden ? '#fbbf24' : '#c026d3', 6);

                        if (p.pulledCount >= p.requiredPull) {
                            // 抜けました！
                            audio.playPop();
                            const pts = (p.isGolden ? 400 : 120) * (p.isLarge ? 2 : 1);
                            state.score += pts;
                            state.harvestCount++;

                            elements.score.innerText = state.score;
                            elements.count.innerText = state.harvestCount;

                            showFloatingText(p.x, p.y, `+${pts}pt!`, p.isGolden ? "text-yellow-300" : "text-purple-300");
                            createParticles(p.x, p.y, p.isGolden ? '#f59e0b' : '#a855f7', 16);

                            state.potatoes.splice(i, 1);

                            // 畑の芋がなくなったら次の畑生成
                            if (state.potatoes.length === 0) {
                                setTimeout(generateField, 400);
                            }
                        }
                    }
                }
            }
        }

        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 4;
                state.particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: 2 + Math.random() * 3,
                    color: color,
                    alpha: 1,
                    life: 0.04
                });
            }
        }

        function gameLoop(timestamp) {
            updateGame();
            renderGame();
            requestAnimationFrame(gameLoop);
        }

        function updateGame() {
            // パーティクル更新
            for (let i = state.particles.length - 1; i >= 0; i--) {
                const p = state.particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= p.life;
                if (p.alpha <= 0) state.particles.splice(i, 1);
            }
        }

        function renderGame() {
            const ctx = state.ctx;
            const w = state.canvas.width;
            const h = state.canvas.height;

            ctx.clearRect(0, 0, w, h);

            // 背景：深層の土
            const grad = ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, '#1a0d03');
            grad.addColorStop(1, '#0d0601');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            // 芋の描画
            state.potatoes.forEach(p => {
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.angle);

                // 蔓（つる）
                ctx.strokeStyle = '#65a30d';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.quadraticCurveTo(-15, -40, 0, -p.ry - 20);
                ctx.stroke();

                // 芋本体
                ctx.fillStyle = p.isGolden ? '#f59e0b' : '#9333ea';
                ctx.beginPath();
                ctx.ellipse(0, 0, p.rx, p.ry, 0, 0, Math.PI * 2);
                ctx.fill();

                // ひげ根・立体感
                ctx.strokeStyle = p.isGolden ? '#d97706' : '#7e22ce';
                ctx.lineWidth = 3;
                ctx.stroke();

                // 端のツンとした部分
                ctx.beginPath();
                ctx.moveTo(-p.rx, 0);
                ctx.lineTo(-p.rx - 8, 2);
                ctx.moveTo(p.rx, 0);
                ctx.lineTo(p.rx + 8, -2);
                ctx.stroke();

                // 光沢ハイライト
                ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
                ctx.beginPath();
                ctx.ellipse(-p.rx * 0.3, -p.ry * 0.3, p.rx * 0.4, p.ry * 0.3, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            });

            // 障害物描画
            state.obstacles.forEach(o => {
                ctx.save();
                if (o.type === 'mole') {
                    // モグラ
                    ctx.fillStyle = '#451a03';
                    ctx.beginPath();
                    ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
                    ctx.fill();
                    // 赤い鼻
                    ctx.fillStyle = '#ef4444';
                    ctx.beginPath();
                    ctx.arc(o.x, o.y - 2, 5, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // 石
                    ctx.fillStyle = '#78716c';
                    ctx.beginPath();
                    ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            });

            // 土（上層）を描画
            ctx.drawImage(state.dirtCanvas, 0, 0);

            // パーティクル描画
            state.particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        function showFloatingText(x, y, text, colorClass) {
            const el = document.createElement('div');
            el.className = `absolute font-black text-lg sm:text-xl splash-text pointer-events-none transition-all duration-700 ease-out ${colorClass}`;
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            el.style.transform = 'translate(-50%, -50%) scale(0.8)';
            el.innerText = text;

            elements.effectLayer.appendChild(el);

            setTimeout(() => {
                el.style.transform = 'translate(-50%, -120%) scale(1.2)';
                el.style.opacity = '0';
            }, 50);

            setTimeout(() => el.remove(), 750);
        }

        function startGame() {
            state.score = 0;
            state.harvestCount = 0;
            state.timeLeft = 50;
            state.isPlaying = true;
            state.particles = [];

            elements.score.innerText = '0';
            elements.count.innerText = '0';
            elements.timer.innerText = '50';

            elements.overlay.classList.add('hidden');
            elements.startScreen.classList.add('hidden');
            elements.resultScreen.classList.add('hidden');
            elements.hintOverlay.style.opacity = '1';

            generateField();

            if (state.timerId) clearInterval(state.timerId);
            state.timerId = setInterval(() => {
                state.timeLeft--;
                elements.timer.innerText = state.timeLeft;

                if (state.timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            state.isPlaying = false;
            clearInterval(state.timerId);

            elements.finalScore.innerText = state.score;
            elements.finalCount.innerText = state.harvestCount;

            let title = "見習い芋ほり";
            if (state.score >= 3500) title = "伝説の芋掘り神";
            else if (state.score >= 2200) title = "ホクホク焼き芋名人";
            else if (state.score >= 1200) title = "ベテラン農家";
            else if (state.score >= 500) title = "期待の芋ハンター";
            elements.titleBadge.innerText = title;

            elements.overlay.classList.remove('hidden');
            elements.resultScreen.classList.remove('hidden');
        }

        window.onload = () => {
            init();
        };
    </script>
</body>
</html>
